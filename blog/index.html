<style>
  :root{--bg:#f5f9fc;--ink:#0e2233;--text:#324a5c;--muted:#6e8294;--line:#d9e6f0;--card:#fff;
    --brand:#0b5fa8;--brand2:#1899c9;--navy:#062338;--sky:#e8f3fb;
    --shadow2:0 10px 26px rgba(9,52,96,.08)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.7;font-size:16px}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  header{position:sticky;top:0;z-index:60;background:rgba(245,249,252,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
  .brand b{font-size:16.5px;color:var(--ink)}
  .brand-logo{height:32px;width:auto;display:block}
  .back{text-decoration:none;font-size:13.5px;font-weight:700;color:var(--brand);background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:9px 18px}
  .back:hover{border-color:var(--brand)}
  .head{padding:60px 0 30px}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand);background:var(--sky);border:1px solid var(--line);border-radius:99px;padding:6px 13px;margin-bottom:14px}
  h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .head p{margin-top:10px;color:var(--muted);font-size:14.5px}
  .blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:14px 0 90px}
  .blog-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow2);overflow:hidden;display:flex;flex-direction:column}
  .blog-thumb{display:block;aspect-ratio:1/1;background:linear-gradient(120deg,var(--brand),var(--brand2));overflow:hidden}
  .blog-thumb img{width:100%;height:100%;object-fit:cover;background:#fff}
  .blog-thumb.placeholder{display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.1em;text-decoration:none}
  .blog-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
  .blog-meta{font-size:12px;color:var(--muted);font-weight:600}
  .blog-title{font-size:16px;font-weight:800;color:var(--ink)}
  .blog-excerpt{font-size:13.5px;color:var(--muted);line-height:1.6;flex:1}
  .blog-read{font-size:13px;font-weight:700;color:var(--brand);text-decoration:none}
  .blog-read:hover{text-decoration:underline}
  @media(max-width:920px){.blog-grid{grid-template-columns:1fr}}
  footer{background:#04192a;color:#8aa6bb;padding:32px 0;font-size:13px;text-align:center}
  footer a{color:#bcd3e4}

/* 모바일 최적화 */
*{box-sizing:border-box}img{max-width:100%;height:auto}body{overflow-x:hidden}
@media(max-width:720px){body{font-size:15px}.wrap{padding-left:16px!important;padding-right:16px!important}header .wrap{min-height:62px;gap:12px}.brand-logo{height:32px!important}h1{font-size:28px!important;line-height:1.3!important}.grid,.blog-grid{grid-template-columns:1fr!important}.card,.blog-card{min-width:0}.back{font-size:13px;white-space:nowrap}article{padding-top:36px!important;padding-bottom:60px!important}article h2{font-size:21px!important;margin-top:34px!important}.lead{font-size:16px!important;padding:18px!important}}
@media(max-width:420px){.wrap{padding-left:14px!important;padding-right:14px!important}h1{font-size:25px!important}.brand-logo{height:29px!important}}


/* 2026-11-22: consistent Korean line breaks on blog pages */
:where(h1,h2,h3,p,li,.blog-title,.blog-excerpt,.head p,.meta,.lead,.tipbox,.cta,
 .blog-body,.blog-card,footer){word-break:keep-all;overflow-wrap:break-word}
:where(h1,h2,h3){text-wrap:balance}
:where(p,li,.blog-excerpt){text-wrap:pretty}
:where(.wrap,.blog-grid,.blog-card,.blog-body,.nav,.brand,.cta){min-width:0}
.back{max-width:100%;white-space:normal;text-align:center}
footer{padding-left:16px;padding-right:16px}
@media(max-width:420px){.nav{gap:9px}.back{padding:9px 12px}}

<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="../index.html" aria-label="METAS CORPORATION 홈"><img class="brand-logo" src="../assets/metas-logo.png" alt="METAS CORPORATION"></a>
    <a class="back" href="../index.html">← 메인으로</a>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <span class="badge">METAS TRADE BLOG</span>
    <h1>블로그</h1>
    <p>수출입 실무, 해외 소싱, 통관, 시장 동향 등 무역 실무 정보를 업데이트합니다.</p>
  </div>
  <div class="blog-grid" id="blogGrid" aria-live="polite">
    <article class="blog-card"><div class="blog-body"><div class="blog-meta">불러오는 중</div><h3 class="blog-title">블로그 글을 불러오고 있습니다.</h3></div></article>
  </div>
</main>

<footer>
  METAS CORPORATION · Business Inquiry: <a href="mailto:business@metas-corp.com">business@metas-corp.com</a><br>
  © 2026 METAS CORPORATION. All rights reserved.
</footer>

<script>
  async function loadAllPosts(){
    const grid = document.getElementById('blogGrid');
    const escapeHtml = v => String(v || '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

    function render(posts){
      if(!(posts || []).length){
        grid.innerHTML = '<article class="blog-card"><div class="blog-body"><h3 class="blog-title">등록된 블로그 글이 없습니다.</h3></div></article>';
        return;
      }
      grid.innerHTML = posts.map(post => {
        const rawUrl = String(post.url || '');
        const rawThumb = String(post.thumbnail || '');
        const isExternal = value => /^(https?:)?\/\//i.test(value) || value.startsWith('/');
        // posts.json은 루트 기준으로 blog/... 경로를 저장해도 되고,
        // blog 폴더 내부 기준으로 파일명만 저장해도 정상 작동합니다.
        const url = isExternal(rawUrl) ? rawUrl : rawUrl.replace(/^blog\//,'');
        const thumb = isExternal(rawThumb) ? rawThumb : rawThumb.replace(/^blog\//,'');
        return `
        <article class="blog-card">
          ${thumb
            ? `<a class="blog-thumb" href="${escapeHtml(url)}"><img src="${escapeHtml(thumb)}" alt="${escapeHtml(post.alt || post.title)}" loading="lazy"></a>`
            : `<a class="blog-thumb placeholder" href="${escapeHtml(url)}">METAS TRADE BLOG</a>`}
          <div class="blog-body">
            <div class="blog-meta">${escapeHtml(post.date)} · ${escapeHtml(post.category || '무역 실무')}</div>
            <h3 class="blog-title">${escapeHtml(post.title)}</h3>
            <p class="blog-excerpt">${escapeHtml(post.excerpt)}</p>
            <a class="blog-read" href="${escapeHtml(url)}">자세히 보기</a>
          </div>
        </article>`;
      }).join('');
    }

    try{
      const res = await fetch('posts.json', {cache:'no-store'});
      if(!res.ok) throw new Error('load failed');
      render(await res.json());
    }catch(e){
      render([]);
    }
  }
  loadAllPosts();
</script>
</body>
